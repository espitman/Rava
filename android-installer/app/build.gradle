plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.rava.installer'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.rava.installer'
        minSdk 26
        targetSdk 36
        versionCode 15
        versionName '1.0.2'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDir layout.buildDirectory.dir('generated/rava-assets')
        main.jniLibs.srcDir layout.buildDirectory.dir('generated/codex-jni')
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/libcodex_app_server.so']
        }
    }

    lint {
        disable 'ChromeOsAbiSupport'
    }
}

def generatedRavaAssets = layout.buildDirectory.dir('generated/rava-assets')
def generatedCodexJni = layout.buildDirectory.dir('generated/codex-jni')

tasks.register('prepareProviderAssets', Copy) {
    from('../../android-runtime-probe') {
        include 'antigravity-termux.env'
        include 'scripts/install-antigravity-termux.sh'
        include 'scripts/run-antigravity-termux.sh'
        into 'antigravity'
    }
    into generatedRavaAssets
}

tasks.register('prepareCodexRuntime') {
    def source = file('../../android-runtime-probe/app/src/main/jniLibs/arm64-v8a/libcodex_app_server.so')
    def expected = '2442c82c9dc82903b6e50b1695a459d1441c56500852f14e3d03a344e3239d0a'
    inputs.file(source)
    outputs.file(generatedCodexJni.map { it.file('arm64-v8a/libcodex_app_server.so') })
    doLast {
        if (!source.isFile()) throw new GradleException('Missing verified Codex Android runtime')
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        source.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        def actual = digest.digest().encodeHex().toString()
        if (actual != expected) throw new GradleException("Codex runtime hash mismatch: ${actual}")
        copy {
            from source
            into generatedCodexJni.get().dir('arm64-v8a')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareProviderAssets'), tasks.named('prepareCodexRuntime')
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
