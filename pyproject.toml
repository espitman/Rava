[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rava-engine"
version = "0.1.0"
description = "Local multi-provider engine for logged-in ChatGPT and Gemini web sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9,<4",
  "gemini-webapi @ git+https://github.com/HanaokaYuzu/Gemini-API.git@8c5b1dcbf54ecf093551cc20bd25cef438190ba8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
rava-engine = "rava_engine.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rava_engine"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
